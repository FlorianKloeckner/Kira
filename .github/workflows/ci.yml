name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: 
  contents: read

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: dtolnay/rust-toolchain@stable
        - uses: Swatinem/rust-cache@v2
        - run: cargo build --release
        - name: Perft smoke test
          run: |
            ./target/release/Kira perft 4 2>&1 | tee perft.txt
            grep -q "found 197281 nodes" perft.txt

    web: 
      needs: test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: dtolnay/rust-toolchain@stable
          with:
            targets: wasm32-wasip1
        - uses: Swatinem/rust-cache@v2
          with:
            workspaces: web/engine
        - run: cargo build --release --target wasm32-wasip1 --manifest-path web/engine/Cargo.toml
        - run: cp web/engine/target/wasm32-wasip1/release/kira.wasm web/site/
        - uses: actions/upload-pages-artifact@v5
          with:
            path: web/site

    deploy:                          # CD: publish, only from main
      needs: web
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - id: deployment
          uses: actions/deploy-pages@v4